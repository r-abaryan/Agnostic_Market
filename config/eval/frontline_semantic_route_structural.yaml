        - answer_question
        - converse
        - disclose_ai_identity
        - verify_order_status
        - abort_current
        - request_person
    proposal: &remove_proposal
      decision: direct
      capability: modify_cart
      cart_operation: remove
    expected: &remove_expected
      decision: direct
      request: { kind: modify_cart, operation: remove, item: null, quantity: null }
    checklist_cell: bound=0|active=0|cart=0|recent=1
    required_route_leaf: modify_cart:remove

  - case_id: structural_remove_cart_nonempty
    scenario_class: counterfactual
    risk_class: critical
    risk_domain: commerce_effect
    context:
      <<: *remove_base_context
      cart_state: nonempty
    proposal: *remove_proposal
    expected: *remove_expected
    checklist_cell: bound=0|active=0|cart=1|recent=1
    counterfactual_of: structural_remove_base
    changed_dimension: cart_state

