# Semantic-routing corpus, version 2.
#
# Written after a review of v1 found that 42 percent of its cases tested one theme
# whose only failure mode is ending the call early, while the capabilities that move
# money were thin or absent. Weighting here follows what breaks when routing is
# wrong, not how interesting the language is.
#
# Design rules, each answering a specific v1 defect:
#   1. Utterances are voice-real. No spoken quotation marks, which ASR cannot carry,
#      and no meta-questions a caller would never ask.
#   2. Counterfactual pairs and ASR-degraded input sit in the acceptance split, so the
#      gate can fail a model that matches on surface text alone. In v1 every such case
#      was in development and the gate could not detect a lexical matcher.
#   3. No case whose answer resolve_route rewrites is counted inside a zero-tolerance
#      bar. Confirmation-escape cases auto-pass, so they stay in development.
#   4. refund_order destination is covered. v1 had no case at all for redirecting a
#      refund, despite the schema modelling new_instrument and new_address.
#   5. Tenant capability restriction is covered. v1 shipped all 16 capabilities in
#      every case, so it never tested refusal of a capability a tenant lacks.
#   6. Risk tagging reflects consequence. request_person only ends automation, so it
#      is standard/ordinary_intent, not a critical safety surface.

