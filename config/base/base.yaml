# Platform base layer — OWNED BY THE PLATFORM. NOT merchant-editable.
# Safety + structure. Merged FIRST (base -> template -> override); any template/override that
# touches a safety-locked path below is REJECTED by config/resolver.py.
#
# `_platform` holds platform-only safety concerns (guardrails, PCI, verification tiers,
# committed-only auth, egress, CRITICAL_CONFIRMATION_FIELDS, tenant-isolation). These are
# NOT fields of MerchantConfig — the resolver strips `_platform` and `_safety_locked` before
# schema validation. They live here so the safety-lock has something concrete to protect.

_safety_locked:
  - _platform            # the whole platform safety block is immutable
  - schema_version       # structural — merchant may not fork the schema version
  - policies.cancel_batch_max   # safety bound (fits the LangGraph step budget), not a merchant knob
  - runtime.cancellation_quiescence_timeout_seconds
  - runtime.checkpoint_io_timeout_seconds
  - runtime.response_model_node_timeout_seconds
  - runtime.reasoning_model_node_timeout_seconds
  - runtime.caller_audible_model_text_max_chars
  - runtime.semantic_router_input_max_chars
  - runtime.semantic_router_timeout_seconds

_platform:
  # Guardrails / verification / PCI / egress — enforced in code; declared here as the locked
  # platform posture. Values are illustrative structure for Phase 0 (the code is the authority).
  guardrails:
    committed_only_authorization: true
    tenant_isolation: true
  verification_tiers: [0, 1, 2]
  payment:
    out_of_band_only: true
  egress:
    default_deny: true
  # Mirrors CRITICAL_CONFIRMATION_FIELDS in dtos/confirmation.py — THE CODE SET IS THE
  # AUTHORITY (this list is declared posture only; nothing reads it). Kept in sync so the
  # locked platform posture documents what the code enforces.
  critical_confirmation_fields:
    - quantity
    - line_items
    - total_amount
    - order_id
    - new_address
    - new_payment_instrument_ref
    - new_contact
  # Ceilings on merchant-tunable policy — "policy within bounds". A merchant TUNES a value
  # in their override (e.g. require_human_above_usd), the platform CLAMPS it: the resolver
  # REJECTS an override that exceeds a ceiling here, so a merchant can tighten a guard but
  # never disable it (set the human-review threshold impossibly high, or the confirmation
  # window impossibly long). Enforced in config/resolver.py; locked (inside _platform).
  limits:
    refund_require_human_ceiling_usd: 500       # a refund above this ALWAYS needs a human
    pending_confirmation_ttl_max_seconds: 300    # max caller-silence before a pending expires
    refund_returnless_ceiling_usd: 100          # above this, a shipped refund is ALWAYS return-first
    return_window_max_days: 90                  # widest return window a merchant may offer
    # Security attempt-budget ceilings (policies.security.*). A LARGER value weakens security,
    # so the ceiling caps the WEAKENING — a merchant may tighten a budget but never blow it open.
    otp_max_attempts_ceiling: 3                 # most OTP tries against a 6-digit code
    contact_reask_ceiling: 2                    # most identity contact re-asks before a human
    auth_denials_ceiling: 3                     # latest a support-gate human offer may come
    tool_hops_ceiling: 8                        # longest frontline read-tool loop per turn
    clarification_reask_ceiling:
      identity: 2                               # missing verification contact: exit sooner
      support: 4                                # room for multi-slot support requests
      cart: 4                                   # bounded shopping help, never placement
      router: 4                                 # ordinary no-action turns must terminate

# Structural default shared by all merchants (override may not change it — locked above).
schema_version: "0.2"

# Runtime containment, present in the effective MerchantConfig. Unlike `_platform`, these values
# survive resolution because runtime owners consume them; the safety lock prevents tenant tuning.
runtime:
  cancellation_quiescence_timeout_seconds: 2.0
  # Per-operation deadline for checkpoint reads, writes, and deletion. Durable adapters must
  # expose native async methods; this deadline contains backend stalls on the voice event loop.
  checkpoint_io_timeout_seconds: 2.0
  # Whole-node containment deadlines. Reasoning owners can make one bounded corrective
  # provider pass, so they need a distinct ceiling from caller-response nodes.
  response_model_node_timeout_seconds: 2.0
  reasoning_model_node_timeout_seconds: 6.0
  # Hard containment for completed model prose sent to TTS. Prompts remain shorter by design;
  # this ceiling rejects runaway output rather than truncating a caller-facing claim.
  caller_audible_model_text_max_chars: 500
  # Full committed utterance admitted to the semantic-router provider. Reject rather than
  # truncate so routing never acts on a changed caller meaning.
  semantic_router_input_max_chars: 2048
  # Full semantic-router provider call, including configured SDK retries. This is the
  # application deadline; provider defaults do not own voice-turn latency. The initial
  # ceiling matches the documented provisional complex-turn processing budget and must be
  # revisited from 3C latency evidence before shadow activation.
  semantic_router_timeout_seconds: 2.0

# Platform-owned structural policy values. This partial block deep-merges with the category
# template and merchant override; the safety lock above prevents either later layer changing it.
policies:
  cancel_batch_max: 10
  clarification_reask_max:
    identity: 1
    support: 2
    cart: 2
    router: 2

# Call-start AI disclosure (COMPLIANCE 2 / EU AI Act Art. 50(1), applies 2 Aug 2026).
# WORDING is merchant-overridable (brand/voice/locale); WHETHER it plays is code
# (voice/pipeline.py plays it first, uninterruptible) — so this key is NOT safety-locked.
# Recording clause deliberately absent: nothing records in Phase 2 (recording policy = Phase 5).
compliance:
  call_start_disclosure: "Hi, you've reached {display_name}. I'm an automated AI assistant. How can I help?"
