schema_version: "1"
recipe_id: semantic-routing-readiness-independent-20260919
frozen_at: "2026-09-19T18:32:42.1779564+01:00"
purpose: >-
  Define a frozen, independently authored synthetic holdout for the final semantic-routing
  readiness decision. The holdout measures ownership selection only. It does not grant
  authority, execute a capability, or evaluate owner behavior.

independence_contract:
  author_role: isolated_holdout_author
  source_kind: synthetic
  labels_not_used_for_selection: true
  candidate_selection_method: >-
    Freeze the coverage matrix first, then author exactly one candidate for every matrix row.
    Do not generate alternates, score candidates, inspect predicted routes, or retain and reject
    candidates based on an expected label. Assign the expected route only after the candidate
    text and bounded context for the row are frozen.
  observed_evidence_used: false
  allowed_production_contract_sources:
    - src/agnostic_market/dtos/orchestration.py
    - src/agnostic_market/dtos/events.py
    - src/agnostic_market/dtos/confirmation.py
    - src/agnostic_market/agents/capabilities.py
    - src/agnostic_market/agents/routing.py
    - src/agnostic_market/agents/frontline/__init__.py
    - src/agnostic_market/agents/frontline/graph.py
    - src/agnostic_market/agents/frontline/read_flow.py
    - src/agnostic_market/agents/frontline/typed_prompt.py
    - config/base/base.yaml
    - config/base/providers.yaml
    - config/merchants/acme_store.yaml
    - config/merchants/demo_shop.yaml
    - config/templates/fashion/template.yaml
    - config/templates/grocery/template.yaml
  prohibited_observed_evidence_sources:
    - config/eval/frontline_semantic_route*
    - config/telemetry/**
    - tests/test_frontline_eval.py
    - docs/EVALUATION.md
    - docs/BUILD_PLAN.md
    - docs/ROUTING_PLANNER_PLAN.md
    - prior routing reports
    - provider evaluation outputs
    - model predictions for candidate utterances
    - git history for any prohibited source

generation_rules:
  - Use invented caller wording and synthetic identifiers only.
  - Do not copy, paraphrase, or adapt an utterance from any existing evaluation corpus.
  - Keep each utterance self-contained within its bounded RoutingContext.
  - Vary syntax, politeness, disfluency, negation, reported speech, and indirect phrasing without
    adding noise that changes the intended ownership question.
  - Use only coarse RouteProposal fields. Leave owner-gathered fine slots absent from direct
    expectations.
  - Require every expected route to be producible by RouteProposal and unchanged by resolve_route.
  - Keep all ordinary acceptance cases synthetic and all corpus cases acceptance-only.
  - Keep exactly one development projected_case, used only to verify production context projection.
  - Do not run a provider or network evaluation while authoring or validating this holdout.

coverage_rules:
  executable_capabilities:
    - answer_question
    - search_catalog
    - verify_order_status
    - list_orders
    - view_cart
    - modify_cart
    - place_order
    - cancel_orders
    - refund_order
    - return_order
    - change_profile
    - verify_identity
    - switch_account
    - view_identity_status
    - abort_current
    - request_person
  risk_domains:
    - ordinary_intent
    - commerce_read
    - account_read
    - account_control
    - commerce_effect
    - compliance_control
  required_contrasts:
    - direct_continue_clarify
    - unavailable_capability_rejection
    - active_owner_continuation_and_replacement
    - order_context
    - cart_state
    - identity_state
    - negation
    - indirect_and_reporting_language
    - asr_like_natural_speech
    - ordinary_and_confirmation_escape_scopes
  acceptance_case_count: 38

source_cluster_rules:
  - Give every acceptance case exactly one lineage record.
  - Use a unique source_cluster_id for every acceptance case, with no shared conversational or
    paraphrase family across clusters.
  - Record one immutable source_seed for every projected or acceptance case in this recipe.
  - Derive source_fingerprint as lowercase SHA-256 over the exact UTF-8 bytes of source_seed,
    with no newline, prefix, normalization, or case folding.
  - The projected development case has a recorded seed and cluster but is excluded from holdout
    lineage because the readiness schema requires lineage to exactly cover corpus.cases.

