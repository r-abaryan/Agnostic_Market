# Group-C profile fixture for acme_store — the stub account SoR behind the profile-change
# flow. Replaced by the real profile SoR integration in Phase 4. contact_on_file is a
# MASKED factor reference by design (SECURITY §6): the voice plane never holds a raw number.
#
# Fix 5 Milestone B: a `customer_ref -> profile` MAP. The KEY is the owning customer (a closed
# slug into fixtures/customers/, cross-checked at session build); absence is a FAILED LOOKUP, not
# a fallback. A caller may read/change ONLY the profile of the customer their session is BOUND to.
# Only CUST-001 has a profile here — a bound caller for any other customer fails closed (no
# invented data; the real multi-customer dataset is a Phase-4 input).
profiles:
  CUST-001:
    address_on_file: "12 Harbor Lane, Springfield"
    contact_on_file: "number ending 0119"
