name: Release image

# DISABLED. This file lives outside .github/workflows/ on purpose, so GitHub Actions
# never loads it and it cannot be triggered, manually or otherwise.
#
# Re-enable by moving it back to .github/workflows/ once all three hold:
#   1. a semantic-routing artifact whose gate passes on the current corpus fingerprint,
#   2. a frozen schema-5 latency methodology,
#   3. the two startup evidence files tracked in git, or the build check below fails.
# Until then an image would build but could not start, and could not be certified.
# The Dockerfile it builds has never been executed. See docs/BUILD_PLAN.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.reference.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the lowercase registry reference
        id: reference
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push the commit-pinned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.reference.outputs.image }}:${{ github.sha }}
          # Keep the pushed artifact a plain manifest so outputs.digest is the
          # manifest digest, not an attestation index digest.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the immutable build identity
        run: |
          {
            echo "### Immutable build identity"
            echo
            echo "Deploy by digest, never by tag:"
            echo
            echo '```'
            echo "${{ steps.reference.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Certification and activation must receive exactly:"
            echo
            echo '```'
            echo "VOICE_AGENT_BUILD_ARTIFACT_DIGEST=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed if the digest is not an OCI sha256 reference
        run: |
          digest='${{ steps.build.outputs.digest }}'
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "build digest is not a valid OCI reference: $digest" >&2
            exit 1
          fi
